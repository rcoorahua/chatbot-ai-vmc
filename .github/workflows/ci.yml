# CI — corre en todo PR y en push a develop/main. NO necesita credenciales AWS.
name: ci

on:
  pull_request:
  push:
    branches: [main, develop]
  workflow_dispatch: # permite re-correr el CI a mano desde la pestana Actions

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install ruff
      - run: ruff check .

  test:
    runs-on: ubuntu-latest
    services:
      dynamodb:
        image: amazon/dynamodb-local:2.5.2
        ports: ["8001:8000"]
      localstack:
        image: localstack/localstack:3.7
        ports: ["4566:4566"]
        env:
          SERVICES: sqs,s3
    env:
      AWS_REGION: us-east-1
      AWS_ACCESS_KEY_ID: local
      AWS_SECRET_ACCESS_KEY: local
      DYNAMODB_ENDPOINT_URL: http://localhost:8001
      SQS_ENDPOINT_URL: http://localhost:4566
      S3_ENDPOINT_URL: http://localhost:4566
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - run: python -m pytest -q

  # infra/tests corre primero (aws_cdk.assertions, sin Docker) y luego valida la infra sin
  # desplegar. Docker está disponible en el runner para el bundling de PythonFunction. No usa
  # credenciales: el stack es env-agnostic (account=None).
  synth:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - run: pip install -r infra/requirements.txt
      - run: python -m pytest tests -q
        working-directory: infra
      - run: npx -y aws-cdk@2 synth -c stage=stage
        working-directory: infra
