# CD — MAQUETADO Y APAGADO (if: false) hasta cerrar PLAN.md §6 con el equipo AWS.
#
# Para activarlo hace falta (en este orden):
#   1. Cuenta(s) AWS + region + `cdk bootstrap` (PLAN.md §6.1-6.2).
#   2. Un rol IAM para GitHub OIDC por entorno, con confianza en este repo y permiso
#      sts:AssumeRole sobre arn:aws:iam::*:role/cdk-* (PLAN.md §6.3). SIN access keys en secrets.
#   3. Variables de repo: AWS_STAGE_DEPLOY_ROLE_ARN, AWS_PROD_DEPLOY_ROLE_ARN, AWS_REGION.
#   4. Environments en GitHub: `stage` (sin gate) y `prod` (required reviewers).
#   5. Quitar los `if: false` de abajo.
#
# Mapeo rama → entorno AWS:  develop → stage  ·  main → prod  (dev es local, no se despliega).
name: deploy

on:
  push:
    branches: [develop, main]

permissions:
  contents: read
  id-token: write # OIDC hacia AWS

jobs:
  deploy-stage:
    # ← BLOQUEADO: quitar el "false &&" al cerrar PLAN.md §6. La rama se decide AQUI, a nivel
    # de job: con el `if` solo en el checkout, un push a main habria corrido este job sin
    # codigo y fallado en el pip install (auditoria 2026-09-06).
    if: ${{ false && github.ref == 'refs/heads/develop' }}
    runs-on: ubuntu-latest
    environment: stage
    concurrency: deploy-stage
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_STAGE_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      - run: pip install -r infra/requirements.txt
      - run: npx -y aws-cdk@2.1139.0 deploy -c stage=stage --require-approval never
        working-directory: infra

  deploy-prod:
    # ← BLOQUEADO: quitar el "false &&" al cerrar PLAN.md §6 + environment `prod` con reviewers
    if: ${{ false && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    environment: prod # gate manual: required reviewers aprueban aqui
    concurrency: deploy-prod
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_PROD_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      - run: pip install -r infra/requirements.txt
      - run: npx -y aws-cdk@2.1139.0 diff -c stage=prod
        working-directory: infra
      - run: npx -y aws-cdk@2.1139.0 deploy -c stage=prod --require-approval never
        working-directory: infra
